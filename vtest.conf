# Vayu flight-stack test suites. See the vtest README for the format.
#
# vtest builds each suite on demand when a case is selected, so a cold tree
# costs nothing until you actually run something.

[sitl]
adapter = ctest
dir     = build_sitl
prefix  = test_
open    = 1

[gcs]
adapter = ctest
dir     = navigator/build
filter  = ^tst_

[fw-host]
adapter = ctest
dir     = build_fwtest
prefix  = test_

# Integration tests drive the in-process SITL binary; the pytest adapter builds
# it (build_sitl_rtos) before running.
[headless]
adapter = pytest
dir     = navigator/headless-sdk
filter  = tests
