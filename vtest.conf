# Vayu flight-stack suites and checks. See the vtest README for the format.
#
# Suites build on demand when a case is selected, so a cold tree costs nothing
# until something is actually run.

# ---------------------------------------------------------------- test suites
[sitl]
adapter = ctest
dir     = build_sitl
prefix  = test_
configure = cmake -S sim/host -B build_sitl
open    = 1

[gcs]
adapter = ctest
dir     = navigator/build
filter  = ^tst_

[fw-host]
adapter = ctest
dir     = build_fwtest
prefix  = test_
configure = cmake -S firmware/tests/host -B build_fwtest

# Integration tests drive the in-process SITL binary; the pytest adapter builds
# it (build_sitl_rtos) before running.
[headless]
adapter = pytest
dir     = navigator/headless-sdk
filter  = tests

# The same SITL cases in differently-configured build dirs -- no new machinery,
# just -D flags and a dir nobody has configured yet.
[sitl-asan]
adapter = ctest
dir     = build_san
prefix  = test_
configure = cmake -S sim/host -B build_san -DVAYU_SANITIZE=ON

# --------------------------------------------------------------------- checks
# Whole-repo gates: one command, one verdict. These belong to no single CMake
# project -- clang-format spans four of them -- so they live here, not in ctest.

[coverage]
adapter = check
configure = cmake -S sim/host -B build_cov -DVAYU_COVERAGE=ON
cmd     = cmake --build build_cov -j"$(nproc)" && cmake --build build_cov --target coverage-gate

[format]
adapter = check
cmd     = tools/dev/run_clang_format.sh --check

[tidy]
adapter = check
cmd     = CLANG_TIDY=${CLANG_TIDY:-clang-tidy-18} tools/dev/run_clang_tidy.sh firmware/build firmware/build_hwtest firmware/tests/host/build sim/host/build

[cppcheck]
adapter = check
cmd     = cppcheck --enable=warning,portability --std=c11 --quiet --error-exitcode=1 --inline-suppr --suppress=missingInclude -I firmware/include firmware/src/

[trace]
adapter = check
cmd     = python3 tools/dev/trace.py --check

[docs-links]
adapter = check
cmd     = python3 tools/dev/docs_html.py --check

[loc]
adapter = check
cmd     = vtest/loc.sh firmware navigator sim navlink tools
