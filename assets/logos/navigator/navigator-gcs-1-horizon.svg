<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="ghc"><circle cx="120" cy="120" r="80"/></clipPath>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa9ff"/><stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="ggnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5651d"/><stop offset="1" stop-color="#6b3e10"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="112" fill="#0c1320"/>
  <!-- attitude ball, rolled to feel live -->
  <g clip-path="url(#ghc)">
    <g transform="rotate(-14 120 120)">
      <rect x="20" y="20" width="200" height="105" fill="url(#gsky)"/>
      <rect x="20" y="125" width="200" height="115" fill="url(#ggnd)"/>
      <line x1="20" y1="125" x2="220" y2="125" stroke="#ffffff" stroke-width="4"/>
      <!-- pitch ladder -->
      <g stroke="#ffffff" stroke-width="3" opacity="0.85" stroke-linecap="round">
        <line x1="98" y1="100" x2="142" y2="100"/>
        <line x1="106" y1="150" x2="134" y2="150"/>
      </g>
    </g>
  </g>
  <circle cx="120" cy="120" r="80" fill="none" stroke="#243047" stroke-width="6"/>
  <!-- fixed aircraft reference -->
  <g stroke="#ffd166" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="84" y1="120" x2="106" y2="120"/>
    <line x1="134" y1="120" x2="156" y2="120"/>
  </g>
  <circle cx="120" cy="120" r="5" fill="#ffd166"/>
  <!-- roll pointer -->
  <polygon points="120,40 112,54 128,54" fill="#ffd166"/>
</svg>
