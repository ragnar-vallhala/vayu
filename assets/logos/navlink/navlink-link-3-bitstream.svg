<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="lbs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/><stop offset="1" stop-color="#0072ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="48" fill="#05182e"/>
  <!-- endpoints -->
  <circle cx="44" cy="120" r="12" fill="#00c6ff"/>
