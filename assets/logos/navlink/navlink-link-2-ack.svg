<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="lkcmd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b86e5"/><stop offset="1" stop-color="#36d1dc"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="112" fill="#06182a"/>
  <!-- endpoints -->
  <circle cx="60" cy="120" r="14" fill="#36d1dc"/>
  <circle cx="180" cy="120" r="14" fill="#43e97b"/>
