# Vayu firmware + SITL CI (R12.1).
#
# Skipped when a change touches only markdown. The GCS lives in its own
# repository now (vayu-navigator) and has its own CI; it consumes this build's
# SITL SDK artifact rather than compiling any of it, so nothing here waits on
# it. Whole-tree gates (clang-format, docs, trace, commit messages) are in
# gates.yml, unfiltered.
#
# Jobs:
#   * Gates on the committed tree:
#       - build-target  : arm-none-eabi build, all modules under -Werror (R1.2)
#       - cppcheck      : static analysis (report-only baseline, R12.3)
#   * SITL host-harness jobs (sim/host/tests/ is committed):
#       - sitl-tests    : host unit tests (R12.1)
#       - sanitizers    : ASan + UBSan unit tests (R12.2)
#       - coverage      : gcov/gcovr summary on CTRL/EST/COMM (R12.4)
#       - clang-tidy    : .clang-tidy ruleset over the firmware + sim databases,
#                         GATING (CONV-04 / R12.3)
#
# Deferred (heavy, tracked separately): Renode ISR/timing (R12.6),
# state-machine SITL transition coverage (R12.7).

name: ci

# NO paths-ignore here, deliberately, and it used to be here.
#
# A prose-only change still cannot break a build, and this workflow still costs
# about twenty runner-minutes to say so -- but "CI required" is now a REQUIRED
# status check, and a workflow that does not TRIGGER never reports its context.
# A required context that never reports leaves the pull request blocked
# indefinitely rather than passing it, which presents as CI hanging. A docs-only
# change was unmergeable until this was moved.
#
# So the workflow always triggers and the filter moved into the `changes` job
# below: the heavy jobs skip on prose, the fan-in still runs, and the fan-in
# already counts skipped as success. Same runner minutes saved, context always
# reported.
on:
  push:
    branches: [main]
    # Version tags publish a real release (see the versioned publish step), and
    # a tag must build whatever it points at -- `changes` forces the suite on
    # for every non-pull_request event for that reason.
    tags: ['v[0-9]*']
  pull_request:

jobs:
  # Does anything that can break a build differ from the base? The filter that
  # used to live on the trigger, moved where it cannot suppress the fan-in's
  # status report. See tools/dev/ci_code_changed.sh.
  changes:
    name: code changed?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.probe.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base commit has to be present to diff against it, and the
          # default shallow fetch does not have it.
          fetch-depth: 0
      - id: probe
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'not a pull request -- running the suite regardless'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(tools/dev/ci_code_changed.sh \
                   '${{ github.event.pull_request.base.sha }}' \
                   '${{ github.event.pull_request.head.sha }}')
          echo "code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-target:
    name: build (arm-none-eabi, -Werror)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: Install kconfiglib
        # --break-system-packages: the runner image is Debian-based and its
        # python3 is PEP 668 externally-managed, so a bare `pip install` is
        # refused. Harmless on a throwaway CI container, and the flag is a
        # no-op where the environment is not marked. Needed to run this
        # workflow under `act` (catthehacker/ubuntu:act-latest), which is
        # otherwise the same image GitHub uses.
        run: pip install --break-system-packages kconfiglib
      - name: Configure + build
        run: |
          cmake -S firmware -B build
          cmake --build build -j

  cppcheck:
    name: cppcheck (baseline)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck over src/ (vendored extern/ excluded)
        # Report-only until the baseline is burned down (R12.3); flip to
        # failing once clean.
        run: |
          cppcheck --enable=warning,portability --std=c11 --quiet --error-exitcode=1 \
            --inline-suppr --suppress=missingInclude -I firmware/include firmware/src/

  sitl-tests:
    name: SITL unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-numpy
      # The sim/host configure now runs vaios's and NavHAL's Kconfig generators:
      # vaios 0.2.0 has no static config header, so without this the build dies at
      # "python module 'kconfiglib' is required" before a single file compiles.
      # See build-target for the --break-system-packages note.
      - run: pip install --break-system-packages kconfiglib
      - run: |
          cmake -S sim/host -B build_sitl
          cmake --build build_sitl -j
          ctest --test-dir build_sitl --output-on-failure

  sitl-module:
    name: SITL loadable module + SDK tarball
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Needed to publish the rolling SDK release below. Everything else in this
    # workflow is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # git describe needs tags for the build id
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # The sim/host configure now runs vaios's and NavHAL's Kconfig generators:
      # vaios 0.2.0 has no static config header, so without this the build dies at
      # "python module 'kconfiglib' is required" before a single file compiles.
      # See build-target for the --break-system-packages note.
      - run: pip install --break-system-packages kconfiglib
      - name: Build the module and package the SDK
        # test_sitl_module is named explicitly: vayu_sitl_package deliberately
        # does NOT depend on it (packaging should not need the tests), so
        # building only the package target leaves no test binary and the step
        # below reports "Not Run" rather than a pass. That is how this job
        # failed on its first outing.
        run: |
          cmake -S sim/host -B build_sitl_rtos -DVAYU_SITL_RTOS_BUILD=ON
          cmake --build build_sitl_rtos -j \
            --target vayu_sitl_package test_sitl_module
      - name: Prove it loads and drives the firmware
        # Not just "it built": the module test dlopens it with no firmware
        # linked, checks the ABI gate both ways, and asserts an injected
        # NavLink command reaches the real command path. A module that builds
        # but cannot be loaded is the failure this job exists to catch.
        run: ctest --test-dir build_sitl_rtos -R sitl_module --output-on-failure
      - name: Check the tarball holds exactly the shipping surface
        # The contract a host depends on is one .so and two headers. If that
        # set ever changes, it should change deliberately, not by someone
        # adding a file to sdk/.
        run: |
          # LC_ALL=C: a case-insensitive locale sorts bin/ before BUILD_ID and
          # a C locale does the reverse, so an unpinned sort makes this check
          # pass or fail on the runner's locale rather than on the contents.
          actual=$(tar tzf build_sitl_rtos/vayu-sitl-sdk.tar.gz \
                   | grep -v '/$' | LC_ALL=C sort | tr '\n' ' ')
          expected='vayu-sitl-sdk/BUILD_ID vayu-sitl-sdk/bin/vayu_sitl_rtos vayu-sitl-sdk/include/trimesh_bvh.h vayu-sitl-sdk/include/vayu_sitl_abi.h vayu-sitl-sdk/include/vsim_math.h vayu-sitl-sdk/include/vsim_proto.h vayu-sitl-sdk/lib/libvayu_sitl.so '
          if [ "$actual" != "$expected" ]; then
            echo "SDK tarball contents changed."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "build id: $(tar xzf build_sitl_rtos/vayu-sitl-sdk.tar.gz -O vayu-sitl-sdk/BUILD_ID)"
      - uses: actions/upload-artifact@v4
        with:
          name: vayu-sitl-sdk-linux-x86_64
          path: build_sitl_rtos/vayu-sitl-sdk.tar.gz
          if-no-files-found: error

      # Publish the SDK where another repository can actually fetch it.
      #
      # The artifact above is NOT enough: Actions artifacts need an
      # authenticated, same-repo token, so vayu-navigator's CI cannot read one
      # even though this repo is public. A release asset on a public repo
      # downloads over plain HTTPS with no token at all, which is what the GCS
      # build needs -- and what a person wanting to run the simulator needs
      # too.
      #
      # One rolling tag rather than a release per commit: the SDK tracks main,
      # and a consumer that wants a fixed engine pins a real version tag
      # instead. --clobber replaces the asset in place so the URL is stable.
      - name: Publish the rolling SDK release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_ID=$(tar xzf build_sitl_rtos/vayu-sitl-sdk.tar.gz -O vayu-sitl-sdk/BUILD_ID)
          {
            echo "Built from \`$BUILD_ID\`."
            echo
            echo "The Vayu SITL engine built from main: the loadable module"
            echo "(\`lib/libvayu_sitl.so\`), the headless binary"
            echo "(\`bin/vayu_sitl_rtos\`), and the four headers a host compiles"
            echo "against."
            echo
            echo "**This is a moving target.** It is replaced on every push to"
            echo "main, so the download URL is stable and the contents are not."
            echo "For a fixed engine, use a version release instead."
          } > notes.md
          gh release view sitl-sdk-latest >/dev/null 2>&1 \
            || gh release create sitl-sdk-latest --prerelease \
                 --title "SITL SDK (rolling)" --notes-file notes.md
          gh release upload sitl-sdk-latest \
            build_sitl_rtos/vayu-sitl-sdk.tar.gz --clobber
          gh release edit sitl-sdk-latest --prerelease --notes-file notes.md
          echo "published sitl-sdk-latest ($BUILD_ID)"

      # A real release, from a real tag. Not a prerelease, so it is what the
      # repo's front page and /releases/latest point at -- the rolling one
      # stays flagged precisely so it never outranks these.
      #
      # The asset is versioned in its filename: a release is permanent, and two
      # files called vayu-sitl-sdk.tar.gz sitting in different releases is a
      # trap for anyone who downloads both.
      - name: Publish the versioned SDK release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUILD_ID=$(tar xzf build_sitl_rtos/vayu-sitl-sdk.tar.gz -O vayu-sitl-sdk/BUILD_ID)
          ASSET="vayu-sitl-sdk-${TAG}-linux-x86_64.tar.gz"
          cp build_sitl_rtos/vayu-sitl-sdk.tar.gz "$ASSET"
          {
            echo "## SITL SDK"
            echo
            echo "Built from \`$BUILD_ID\`."
            echo
            echo "The firmware compiled for the host, for anything that wants to"
            echo "run the simulator without building firmware:"
            echo
            echo "- \`lib/libvayu_sitl.so\` — the engine as a loadable module"
            echo "  (ABI 3), for an in-process simulator."
            echo "- \`bin/vayu_sitl_rtos\` — the same engine as a headless"
            echo "  binary, driven over its FIFOs."
            echo "- \`include/\` — the four headers a host compiles against."
            echo
            echo '```sh'
            echo "curl -sSLf -O https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
            echo "tar xzf ${ASSET}"
            echo '```'
            echo
            echo "Unpack it at the root of a consuming repository and its build"
            echo "finds \`vayu-sitl-sdk/include\` without further configuration."
          } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" "$ASSET" --clobber
          echo "published $TAG ($BUILD_ID)"

  sanitizers:
    name: SITL ASan + UBSan (R12.2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-numpy
      # The sim/host configure now runs vaios's and NavHAL's Kconfig generators:
      # vaios 0.2.0 has no static config header, so without this the build dies at
      # "python module 'kconfiglib' is required" before a single file compiles.
      # See build-target for the --break-system-packages note.
      - run: pip install --break-system-packages kconfiglib
      - run: |
          cmake -S sim/host -B build_san -DVAYU_SANITIZE=ON
          cmake --build build_san -j
          ctest --test-dir build_san --output-on-failure

  coverage:
    name: SITL coverage (R12.4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake gcovr python3 python3-numpy
      # The sim/host configure now runs vaios's and NavHAL's Kconfig generators:
      # vaios 0.2.0 has no static config header, so without this the build dies at
      # "python module 'kconfiglib' is required" before a single file compiles.
      # See build-target for the --break-system-packages note.
      - run: pip install --break-system-packages kconfiglib
      - name: Build + coverage ratchet gate
        # Enforcing: tools/coverage_gate.py fails the build if any component's
        # line coverage drops below its committed floor (set at the 2026-06-28
        # baseline). Raise a floor in the same PR that raises its coverage.
        run: |
          cmake -S sim/host -B build_cov -DVAYU_COVERAGE=ON
          cmake --build build_cov -j
          cmake --build build_cov --target coverage-gate

  clang-tidy:
    name: clang-tidy (.clang-tidy, gate)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          # Pinned: .clang-tidy is a gate, so a toolchain bump must not land as
          # a red build on an unrelated PR. Match this when bumping locally.
          sudo apt-get install -y cmake clang-tidy-18 gcc-arm-none-eabi jq
      # The firmware configure runs NavHAL's Kconfig generation; without this
      # it dies at "No module named 'kconfiglib'" before clang-tidy sees a
      # single file. The old job hid that behind continue-on-error.
      - run: pip install --break-system-packages kconfiglib  # PEP 668, see build-target
      - name: clang-tidy
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          # A database only has to be CONFIGURED, not built. Navigator is left
          # out here: it needs Qt6 + assimp and a full BUILD (AUTOMOC generates
          # the tst_*.moc its tests include), which no CI job pays for today --
          # so run_clang_tidy.sh with no arguments, locally, is the wider pass.
          # The script's closing "not analysed" list says what CI skipped.
          cmake -S firmware -B firmware/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware -B firmware/build_hwtest -DVAYU_HW_TEST=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware/tests/host -B firmware/tests/host/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # RTOS on: otherwise the SITL engine, the loadable module and
          # sim/vsim's physics are in no database. Navigator used to cover them
          # by compiling the firmware itself; it no longer does.
          cmake -S sim/host -B sim/host/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DVAYU_SITL_RTOS_BUILD=ON
          tools/dev/run_clang_tidy.sh \
            firmware/build firmware/build_hwtest \
            firmware/tests/host/build sim/host/build
  # ---------------------------------------------------------------------------
  # Fan-in. Branch protection requires THIS one context, not the dozen above.
  #
  # Listing twelve literal context names in the protection rule means a
  # renamed or newly added job silently stops being enforced, and nothing
  # reports that. One aggregator cannot drift: a new job added to `needs`
  # is enforced immediately, and one removed from the workflow breaks this
  # job's own syntax rather than quietly loosening the gate.
  #
  # `if: always()` so it runs even when a dependency failed -- without it the
  # job would be skipped, and a skipped required check blocks a PR forever
  # rather than failing it, which looks like CI hanging. Skipped counts as ok,
  # because a job gated on changed paths that legitimately did not run must not
  # read as a failure.
  required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - build-target
      - cppcheck
      - sitl-tests
      - sitl-module
      - sanitizers
      - coverage
      - clang-tidy
    steps:
      # The aggregator verifies its OWN coverage first: a job added to this
      # workflow but never added to `needs` below would report on the PR and be
      # required by nothing. Checked here rather than in a job of its own,
      # because the thing that claims the workflow is green is the right place
      # to prove it is speaking for all of it.
      - uses: actions/checkout@v5
      - name: tools/dev/check_ci_required.sh
        run: tools/dev/check_ci_required.sh
      - name: Aggregate per-job results (success or skipped == ok)
        run: |
          fail=0
          check() {
            local name=$1 result=$2
            case "$result" in
              success|skipped) printf '  \033[32m%-9s\033[0m  %s\n' "$result" "$name" ;;
              *)               printf '  \033[31m%-9s\033[0m  %s\n' "$result" "$name"; fail=1 ;;
            esac
          }
          # `changes` is checked too: if the probe itself fails, every heavy job
          # skips, and without this line the fan-in would call that green.
          check changes        "${{ needs.changes.result }}"
          check build-target   "${{ needs.build-target.result }}"
          check cppcheck       "${{ needs.cppcheck.result }}"
          check sitl-tests     "${{ needs.sitl-tests.result }}"
          check sitl-module    "${{ needs.sitl-module.result }}"
          check sanitizers     "${{ needs.sanitizers.result }}"
          check coverage       "${{ needs.coverage.result }}"
          check clang-tidy     "${{ needs.clang-tidy.result }}"
          if [ "$fail" -eq 0 ]; then
            echo "all green."
          fi
          exit $fail

