# Vayu firmware + SITL CI (R12.1).
#
# Skipped when a change touches only markdown. The GCS lives in its own
# repository now (vayu-navigator) and has its own CI; it consumes this build's
# SITL SDK artifact rather than compiling any of it, so nothing here waits on
# it. Whole-tree gates (clang-format, docs, trace, commit messages) are in
# gates.yml, unfiltered.
#
# Jobs:
#   * Gates on the committed tree:
#       - build-target  : arm-none-eabi build, all modules under -Werror (R1.2)
#       - cppcheck      : static analysis (report-only baseline, R12.3)
#   * SITL host-harness jobs (sim/host/tests/ is committed):
#       - sitl-tests    : host unit tests (R12.1)
#       - sanitizers    : ASan + UBSan unit tests (R12.2)
#       - coverage      : gcov/gcovr summary on CTRL/EST/COMM (R12.4)
#       - clang-tidy    : .clang-tidy ruleset over the firmware + sim databases,
#                         GATING (CONV-04 / R12.3)
#
# Deferred (heavy, tracked separately): Renode ISR/timing (R12.6),
# state-machine SITL transition coverage (R12.7).

name: ci

on:
  push:
    branches: [main]
    # A change that touches nothing but prose cannot break a build, a test or a
    # lint, and this workflow costs about twenty runner-minutes to say so. The
    # gates a docs change *can* break are in gates.yml, which carries no filter.
    # Spelled out twice because Actions does not resolve YAML anchors.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'

jobs:
  build-target:
    name: build (arm-none-eabi, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: Install kconfiglib
        # --break-system-packages: the runner image is Debian-based and its
        # python3 is PEP 668 externally-managed, so a bare `pip install` is
        # refused. Harmless on a throwaway CI container, and the flag is a
        # no-op where the environment is not marked. Needed to run this
        # workflow under `act` (catthehacker/ubuntu:act-latest), which is
        # otherwise the same image GitHub uses.
        run: pip install --break-system-packages kconfiglib
      - name: Configure + build
        run: |
          cmake -S firmware -B build
          cmake --build build -j

  cppcheck:
    name: cppcheck (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck over src/ (vendored extern/ excluded)
        # Report-only until the baseline is burned down (R12.3); flip to
        # failing once clean.
        run: |
          cppcheck --enable=warning,portability --std=c11 --quiet --error-exitcode=1 \
            --inline-suppr --suppress=missingInclude -I firmware/include firmware/src/

  sitl-tests:
    name: SITL unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-numpy
      - run: |
          cmake -S sim/host -B build_sitl
          cmake --build build_sitl -j
          ctest --test-dir build_sitl --output-on-failure

  sitl-module:
    name: SITL loadable module + SDK tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # git describe needs tags for the build id
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Build the module and package the SDK
        run: |
          cmake -S sim/host -B build_sitl_rtos -DVAYU_SITL_RTOS_BUILD=ON
          cmake --build build_sitl_rtos --target vayu_sitl_package -j
      - name: Prove it loads and drives the firmware
        # Not just "it built": the module test dlopens it with no firmware
        # linked, checks the ABI gate both ways, and asserts an injected
        # NavLink command reaches the real command path. A module that builds
        # but cannot be loaded is the failure this job exists to catch.
        run: ctest --test-dir build_sitl_rtos -R sitl_module --output-on-failure
      - name: Check the tarball holds exactly the shipping surface
        # The contract a host depends on is one .so and two headers. If that
        # set ever changes, it should change deliberately, not by someone
        # adding a file to sdk/.
        run: |
          # LC_ALL=C: a case-insensitive locale sorts bin/ before BUILD_ID and
          # a C locale does the reverse, so an unpinned sort makes this check
          # pass or fail on the runner's locale rather than on the contents.
          actual=$(tar tzf build_sitl_rtos/vayu-sitl-sdk.tar.gz \
                   | grep -v '/$' | LC_ALL=C sort | tr '\n' ' ')
          expected='vayu-sitl-sdk/BUILD_ID vayu-sitl-sdk/bin/vayu_sitl_rtos vayu-sitl-sdk/include/trimesh_bvh.h vayu-sitl-sdk/include/vayu_sitl_abi.h vayu-sitl-sdk/include/vsim_math.h vayu-sitl-sdk/include/vsim_proto.h vayu-sitl-sdk/lib/libvayu_sitl.so '
          if [ "$actual" != "$expected" ]; then
            echo "SDK tarball contents changed."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "build id: $(tar xzf build_sitl_rtos/vayu-sitl-sdk.tar.gz -O vayu-sitl-sdk/BUILD_ID)"
      - uses: actions/upload-artifact@v4
        with:
          name: vayu-sitl-sdk-linux-x86_64
          path: build_sitl_rtos/vayu-sitl-sdk.tar.gz
          if-no-files-found: error

  sanitizers:
    name: SITL ASan + UBSan (R12.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-numpy
      - run: |
          cmake -S sim/host -B build_san -DVAYU_SANITIZE=ON
          cmake --build build_san -j
          ctest --test-dir build_san --output-on-failure

  coverage:
    name: SITL coverage (R12.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake gcovr python3 python3-numpy
      - name: Build + coverage ratchet gate
        # Enforcing: tools/coverage_gate.py fails the build if any component's
        # line coverage drops below its committed floor (set at the 2026-06-28
        # baseline). Raise a floor in the same PR that raises its coverage.
        run: |
          cmake -S sim/host -B build_cov -DVAYU_COVERAGE=ON
          cmake --build build_cov -j
          cmake --build build_cov --target coverage-gate

  clang-tidy:
    name: clang-tidy (.clang-tidy, gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          # Pinned: .clang-tidy is a gate, so a toolchain bump must not land as
          # a red build on an unrelated PR. Match this when bumping locally.
          sudo apt-get install -y cmake clang-tidy-18 gcc-arm-none-eabi jq
      # The firmware configure runs NavHAL's Kconfig generation; without this
      # it dies at "No module named 'kconfiglib'" before clang-tidy sees a
      # single file. The old job hid that behind continue-on-error.
      - run: pip install --break-system-packages kconfiglib  # PEP 668, see build-target
      - name: clang-tidy
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          # A database only has to be CONFIGURED, not built. Navigator is left
          # out here: it needs Qt6 + assimp and a full BUILD (AUTOMOC generates
          # the tst_*.moc its tests include), which no CI job pays for today --
          # so run_clang_tidy.sh with no arguments, locally, is the wider pass.
          # The script's closing "not analysed" list says what CI skipped.
          cmake -S firmware -B firmware/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware -B firmware/build_hwtest -DVAYU_HW_TEST=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware/tests/host -B firmware/tests/host/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # RTOS on: otherwise the SITL engine, the loadable module and
          # sim/vsim's physics are in no database. Navigator used to cover them
          # by compiling the firmware itself; it no longer does.
          cmake -S sim/host -B sim/host/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DVAYU_SITL_RTOS_BUILD=ON
          tools/dev/run_clang_tidy.sh \
            firmware/build firmware/build_hwtest \
            firmware/tests/host/build sim/host/build
