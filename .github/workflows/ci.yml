# Vayu firmware CI (R12.1). Runs on every push / PR.
#
# Jobs:
#   * Always-on gates on the committed tree:
#       - build-target  : arm-none-eabi build, all modules under -Werror (R1.2)
#       - trace-gate    : tools/dev/trace.py --check, unknown-ID fails (R12.5)
#       - docs-links    : tools/dev/docs_html.py --check, dangling doc link fails
#       - commit-msgs   : no AI attribution trailers in new commit messages
#       - cppcheck      : static analysis (report-only baseline, R12.3)
#   * SITL host-harness jobs (sim/host/tests/ is committed):
#       - sitl-tests    : host unit tests (R12.1)
#       - sanitizers    : ASan + UBSan unit tests (R12.2)
#       - coverage      : gcov/gcovr summary on CTRL/EST/COMM (R12.4)
#       - clang-format  : .clang-format, whole tree, GATING
#       - clang-tidy    : .clang-tidy ruleset over the firmware + sim databases,
#                         GATING (CONV-04 / R12.3)
#       - navigator     : Qt6 GCS build + its 41 ctest cases, and the clang-tidy
#                         gate over the same database (the two jobs together
#                         cover every non-vendored source)
#
# Deferred (heavy, tracked separately): Renode ISR/timing (R12.6),
# state-machine SITL transition coverage (R12.7).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-target:
    name: build (arm-none-eabi, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: Install kconfiglib
        run: pip install kconfiglib
      - name: Configure + build
        run: |
          cmake -S firmware -B build
          cmake --build build -j

  trace-gate:
    name: trace gate (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: trace.py --check (unknown ID fails; R12.5)
        run: python3 tools/dev/trace.py --check

  commit-msgs:
    name: commit message gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # need history to diff against the base
      - name: No AI attribution trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # A new branch or a force push reports an unusable base; fall back to
          # the tip rather than silently checking nothing.
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            COMMITS=$(git rev-list "$BASE..HEAD")
          else
            COMMITS=$(git rev-list -1 HEAD)
          fi
          # Anchored on the trailer syntax, so prose that merely mentions Claude
          # and a genuine human Co-Authored-By both pass.
          PAT='co-authored-by:.*(claude|anthropic)|generated with .*claude'
          RC=0
          for C in $COMMITS; do
            if git log -1 --format=%B "$C" | grep -Eqi "$PAT"; then
              echo "::error::$(git log -1 --format='%h %s' "$C") carries an AI attribution trailer"
              RC=1
            fi
          done
          [ "$RC" = 0 ] && echo "checked $(echo "$COMMITS" | wc -w) commit(s): no AI attribution trailers"
          exit $RC

  docs-links:
    name: docs link gate (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # pandoc is the only dependency: mermaid and KaTeX are fetched by the
      # browser at view time and are not needed to build or check the site.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: docs_html.py --check (a dangling doc-to-doc link fails)
        run: python3 tools/dev/docs_html.py --check

  cppcheck:
    name: cppcheck (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck over src/ (vendored extern/ excluded)
        # Report-only until the baseline is burned down (R12.3); flip to
        # failing once clean.
        run: |
          cppcheck --enable=warning,portability --std=c11 --quiet --error-exitcode=1 \
            --inline-suppr --suppress=missingInclude -I firmware/include firmware/src/

  sitl-tests:
    name: SITL unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: |
          cmake -S sim/host -B build_sitl
          cmake --build build_sitl -j
          ctest --test-dir build_sitl --output-on-failure

  sanitizers:
    name: SITL ASan + UBSan (R12.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: |
          cmake -S sim/host -B build_san -DVAYU_SANITIZE=ON
          cmake --build build_san -j
          ctest --test-dir build_san --output-on-failure

  coverage:
    name: SITL coverage (R12.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake gcovr python3
      - name: Build + coverage ratchet gate
        # Enforcing: tools/coverage_gate.py fails the build if any component's
        # line coverage drops below its committed floor (set at the 2026-06-28
        # baseline). Raise a floor in the same PR that raises its coverage.
        run: |
          cmake -S sim/host -B build_cov -DVAYU_COVERAGE=ON
          cmake --build build_cov -j
          cmake --build build_cov --target coverage-gate

  clang-format:
    name: clang-format (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: tools/dev/run_clang_format.sh --check
        # Pinned for the same reason clang-tidy is. The tree is clean under
        # both 18.1.3 and the 22.1.1 pip wheel (measured over all 453 files),
        # so a developer on either does not fight this gate.
        env:
          CLANG_FORMAT: clang-format-18
        run: tools/dev/run_clang_format.sh --check

  clang-tidy:
    name: clang-tidy (.clang-tidy, gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          # Pinned: .clang-tidy is a gate, so a toolchain bump must not land as
          # a red build on an unrelated PR. Match this when bumping locally.
          sudo apt-get install -y cmake clang-tidy-18 gcc-arm-none-eabi jq
      - name: clang-tidy
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          # A database only has to be CONFIGURED, not built. Navigator is left
          # out here: it needs Qt6 + assimp and a full BUILD (AUTOMOC generates
          # the tst_*.moc its tests include), which no CI job pays for today --
          # so run_clang_tidy.sh with no arguments, locally, is the wider pass.
          # The script's closing "not analysed" list says what CI skipped.
          cmake -S firmware -B firmware/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware -B firmware/build_hwtest -DVAYU_HW_TEST=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S firmware/tests/host -B firmware/tests/host/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S sim/host -B sim/host/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          tools/dev/run_clang_tidy.sh \
            firmware/build firmware/build_hwtest \
            firmware/tests/host/build sim/host/build

  navigator:
    name: navigator (Qt6 build + tests + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Qt6 + assimp
        run: |
          sudo apt-get update
          # libpulse-dev is optional to the build (find_library, degrades
          # gracefully) but is installed so CI compiles the same audio path a
          # developer machine does, rather than a variant nobody runs.
          sudo apt-get install -y cmake clang-tidy-18 jq \
            qt6-base-dev qt6-base-dev-tools qt6-serialport-dev \
            libgl1-mesa-dev libassimp-dev libpulse-dev
      - name: Configure + build
        # Grass/flora is off by default, which leaves GpuGrass.cpp in no
        # database at all; on here so the analysis below sees it.
        run: |
          cmake -S navigator -B navigator/build-tidy \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNAVIGATOR_SIM_GRASS=ON
          cmake --build navigator/build-tidy -j"$(nproc)"
          # The headless mesh tool is the one source neither job's main
          # database reaches; it needs the same Qt6 + assimp already installed
          # here, and a configure is enough.
          cmake -S navigator/headless-sdk/cpp/worldmesh \
                -B navigator/headless-sdk/cpp/worldmesh/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: ctest
        # 41 cases: 20 QtTest + the 21 SITL cases this tree registers. Several
        # construct widgets, so they need a platform plugin; offscreen is what
        # the headless render test already documents.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir navigator/build-tidy --output-on-failure
      - name: clang-tidy (Navigator, sim, and the firmware sources it compiles)
        # Same gate as the clang-tidy job, over the database only this job can
        # produce: AUTOMOC generates the tst_*.moc the tests include, so it
        # needs a real build, not just a configure. Its closing "not analysed"
        # list is this invocation's -- the clang-tidy job covers the rest.
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          tools/dev/run_clang_tidy.sh \
            navigator/build-tidy navigator/headless-sdk/cpp/worldmesh/build
