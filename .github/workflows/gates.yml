# Gates that are cheap and that a docs-only change can still break (R12.5).
#
# Split out of ci.yml so it can carry no path filter: ci.yml skips its build,
# test and lint jobs when a change touches nothing but markdown, and these three
# are exactly the ones that must keep running when it does -- docs-links checks
# the markdown itself, trace-gate maps requirements in the docs onto code, and
# commit-msgs reads commit messages, which every change has. Together they cost
# about a minute; ci.yml costs twenty.
#
#   - trace-gate    : tools/dev/trace.py --check, unknown-ID fails (R12.5)
#   - docs-links    : tools/dev/docs_html.py --check, dangling doc link fails
#   - commit-msgs   : no AI attribution trailers in new commit messages
#   - clang-format  : .clang-format over the whole tree, GATING
#   - layering      : no silicon in control/ est/ maths/, per-section ratchet
#   - constants     : one home per physical constant (F13)

name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trace-gate:
    name: trace gate (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: trace.py --check (unknown ID fails; R12.5)
        run: python3 tools/dev/trace.py --check

  commit-msgs:
    name: commit message gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # need history to diff against the base
      - name: No AI attribution trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # A new branch or a force push reports an unusable base; fall back to
          # the tip rather than silently checking nothing.
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            COMMITS=$(git rev-list "$BASE..HEAD")
          else
            COMMITS=$(git rev-list -1 HEAD)
          fi
          # Anchored on the trailer syntax, so prose that merely mentions Claude
          # and a genuine human Co-Authored-By both pass.
          PAT='co-authored-by:.*(claude|anthropic)|generated with .*claude'
          RC=0
          for C in $COMMITS; do
            if git log -1 --format=%B "$C" | grep -Eqi "$PAT"; then
              echo "::error::$(git log -1 --format='%h %s' "$C") carries an AI attribution trailer"
              RC=1
            fi
          done
          [ "$RC" = 0 ] && echo "checked $(echo "$COMMITS" | wc -w) commit(s): no AI attribution trailers"
          exit $RC

  docs-links:
    name: docs link gate (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # pandoc is the only dependency: mermaid and KaTeX are fetched by the
      # browser at view time and are not needed to build or check the site.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: docs_html.py --check (a dangling doc-to-doc link fails)
        run: python3 tools/dev/docs_html.py --check

  clang-format:
    name: clang-format (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: tools/dev/run_clang_format.sh --check
        # Pinned for the same reason clang-tidy is. The tree is clean under
        # both 18.1.3 and the 22.1.1 pip wheel (measured over all 453 files),
        # so a developer on either does not fight this gate.
        env:
          CLANG_FORMAT: clang-format-18
        run: tools/dev/run_clang_format.sh --check

  layering:
    name: hardware/logic layering (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No toolchain: the rule is textual by design, so it costs a grep and
      # cannot be skipped by a build that happens not to compile that module.
      - name: tools/dev/check_layering.sh
        run: tools/dev/check_layering.sh
      # Same shape, different rule: one home per physical constant (F13). Also
      # textual, and for the same reason -- both copies of a duplicated
      # constant compile and pass their own tests.
      - name: tools/dev/check_constants.sh
        run: tools/dev/check_constants.sh
  # ---------------------------------------------------------------------------
  # Fan-in. Branch protection requires THIS one context, not the dozen above.
  #
  # Separate from `CI required` because GitHub's `needs` cannot reach across
  # workflows, so one fan-in per workflow file is the most that is possible.
  #
  # `if: always()` so it runs even when a dependency failed -- without it the
  # job would be skipped, and a skipped required check blocks a PR forever
  # rather than failing it, which looks like CI hanging. Skipped counts as ok,
  # because a job gated on changed paths that legitimately did not run must not
  # read as a failure.
  required:
    name: Gates required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - trace-gate
      - commit-msgs
      - docs-links
      - clang-format
      - layering
    steps:
      # The aggregator verifies its OWN coverage first: a job added to this
      # workflow but never added to `needs` below would report on the PR and be
      # required by nothing. Checked here rather than in a job of its own,
      # because the thing that claims the workflow is green is the right place
      # to prove it is speaking for all of it.
      - uses: actions/checkout@v5
      - name: tools/dev/check_ci_required.sh
        run: tools/dev/check_ci_required.sh
      - name: Aggregate per-job results (success or skipped == ok)
        run: |
          fail=0
          check() {
            local name=$1 result=$2
            case "$result" in
              success|skipped) printf '  \033[32m%-9s\033[0m  %s\n' "$result" "$name" ;;
              *)               printf '  \033[31m%-9s\033[0m  %s\n' "$result" "$name"; fail=1 ;;
            esac
          }
          check trace-gate     "${{ needs.trace-gate.result }}"
          check commit-msgs    "${{ needs.commit-msgs.result }}"
          check docs-links     "${{ needs.docs-links.result }}"
          check clang-format   "${{ needs.clang-format.result }}"
          check layering       "${{ needs.layering.result }}"
          if [ "$fail" -eq 0 ]; then
            echo "all green."
          fi
          exit $fail

